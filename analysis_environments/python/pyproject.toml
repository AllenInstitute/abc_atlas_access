[project]
name = "abc-atlas-analysis"
version = "0.1.0"
description = "Python environment for ABC Atlas analysis scripts that read the cloud-native (zarr) data"
requires-python = ">=3.11"
dependencies = [
    # reading the data: AnnData stores in zarr v3 on cloud storage, and their parquet cell/gene tables
    "anndata[lazy]>=0.12",
    "zarr>=3.1",
    "obstore>=0.8",
    "pyarrow>=18",
    "polars>=1.0",
    "duckdb>=1.1",
    # analysis and plotting used by the generated scripts and examples
    "numpy",
    "pandas",
    "matplotlib",
    "scanpy",
    # notebooks
    "jupyterlab",
    "ipykernel",
]

[tool.uv]
package = false
